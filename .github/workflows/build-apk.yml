name: Build WiFiScope Sensor APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Aceptar licencias Android
        run: yes | sdkmanager --licenses || true

      - name: Instalar Android SDK 35
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        working-directory: WiFiScopeSensorAndroid
        run: gradle assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: WiFiScope-Sensor-APK
          path: WiFiScopeSensorAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
